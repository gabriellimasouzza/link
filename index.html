<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ezer.app | Links</title>
    
    <!-- Importando fonte moderna do Google Fonts parecida com a da sua logo -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Importando ícones (Android e Apple) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Paleta de Cores extraída da sua marca */
        :root {
            --bg-color: #f6f5ef; /* Fundo creme claro */
            --blue: #173554;     /* Azul Marinho Ezer */
            --gold: #c39152;     /* Dourado/Mostarda .app */
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--blue);
        }

        .container {
            width: 100%;
            max-width: 450px; /* Mantém estreito como a tela de um celular */
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
        }

        /* Estilo da Logo */
        .logo {
            width: 110px;
            height: auto;
            margin-bottom: 15px;
            /* Filtro leve de sombra para destacar no fundo */
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.1)); 
        }

        /* Título e Slogan */
        .brand-name {
            font-size: 2.8rem;
            font-weight: 800;
            margin: 0 0 5px 0;
            letter-spacing: -1.5px;
        }
        
        .brand-name span.ezer { color: var(--blue); }
        .brand-name span.app { color: var(--gold); font-weight: 600;}

        .slogan {
            font-size: 1rem;
            font-weight: 400;
            margin-top: 0;
            margin-bottom: 40px;
            color: var(--blue);
            opacity: 0.85;
            letter-spacing: 0.5px;
        }

        /* Container dos Botões */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Estilo base dos botões */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px 20px;
            border-radius: 50px; /* Formato de pílula (moderno) */
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .link-btn i {
            margin-right: 12px;
            font-size: 1.3rem;
        }

        /* Botão 1: Android (Destaque) */
        .btn-primary {
            background-color: var(--blue);
            color: var(--bg-color);
            border: 2px solid var(--blue);
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--blue);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(23, 53, 84, 0.2);
        }

        /* Botão 2: iOS (Em Breve) */
        .btn-secondary {
            background-color: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            cursor: not-allowed; /* Mostra que o link não é clicável no momento */
            opacity: 0.8;
        }

        .btn-secondary:hover {
            background-color: var(--gold);
            color: var(--bg-color);
            opacity: 1;
        }

        /* Rodapé opcional discreto */
        .footer {
            margin-top: 50px;
            font-size: 0.8rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ícone do App -->
        <img src="icon.png" alt="Logo Ezer" class="logo">
        
        <!-- Nome formatado com as cores da marca -->
        <h1 class="brand-name"><span class="ezer">Ezer</span><span class="app">.app</span></h1>
        
        <!-- Slogan -->
        <p class="slogan">Sua vida com Deus, um dia de cada vez.</p>

        <!-- Links -->
        <div class="links-container">
            <!-- Coloque o link da Play Store no href abaixo no lugar da # -->
            <a href="#" class="link-btn btn-primary">
                <i class="fab fa-google-play"></i> ANDROID - Baixe meu app: Ezer.app
            </a>
            
            <!-- Link desativado (event.preventDefault evita que a tela pule pro topo se a pessoa clicar) -->
            <a href="#" class="link-btn btn-secondary" onclick="event.preventDefault();">
                <i class="fab fa-apple"></i> iOS: Em breve
            </a>
        </div>

        <div class="footer">
            © Ezer.app | Gabriel Lima de Souza
        </div>
    </div>

</body>
</html>
